<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>心情树 · 追光绿洲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#F7F5F0;min-height:100vh;padding:20px 16px 60px}

/* ---- HEADER ---- */
.header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:16px;gap:10px}
.header-left h1{font-size:22px;font-weight:700;color:#1B5E20}
.header-left p{font-size:13px;color:#8E8E93;margin-top:4px}
.badges{justify-content:center}
.badges{display:flex;gap:8px}
.badge{border-radius:999px;padding:7px 14px;text-align:center;min-width:72px}
.badge.total{background:#EAF3DE}
.badge.total .n{color:#3B6D11}
.badge.total .l{color:#639922}
.badge.pending{background:#FFF4DE}
.badge.pending .n{color:#8A4F0C}
.badge.pending .l{color:#C07010}
.badge .n{font-size:20px;font-weight:600;display:block;line-height:1}
.badge .l{font-size:11px;display:block;margin-top:2px}

/* ---- DESERT ---- */
#desert-wrap{width:100%;height:210px;border-radius:16px;border:1px solid #D4C07A;overflow:hidden;margin-bottom:16px;background:#F5EDD6}
#dsvg{width:100%;height:100%}

/* ---- QUEUE BAR ---- */
.queue-bar{background:#fff;border:1px solid #E5E5EA;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.queue-title{font-size:12px;color:#8E8E93;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.queue-title span{font-size:12px;color:#C07010;font-weight:500}
.queue-slots{display:flex;gap:10px}
.slot{flex:1;height:64px;border-radius:10px;border:1.5px dashed #D4C07A;background:#FBF8F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .3s}
.slot.filled{border:1.5px solid #97C459;background:#F4FAF0}
.slot-icon{font-size:22px;opacity:0.25}
.slot.filled .slot-icon{opacity:1}
.slot-label{font-size:10px;color:#C7C7CC;text-align:center;padding:0 4px;line-height:1.3}
.slot.filled .slot-label{color:#639922}

.dispatch-bar{margin-top:10px}
.dispatch-btn{width:100%;padding:13px;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;transition:all .15s;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.dispatch-btn.locked{background:#F0EFE9;color:#C7C7CC;cursor:default}
.dispatch-btn.ready{background:#F0A030;color:#fff}
.dispatch-btn.ready:hover{background:#D4871A}
.dispatch-btn.ready:active{transform:scale(0.98)}
.dispatch-btn.going{background:#FFF4DE;color:#8A4F0C;border:1.5px solid #F0A030;cursor:default}
.dispatch-btn.done-btn{background:#EAF3DE;color:#2A5A08;cursor:default}
.dot-anim{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C07010;animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.progress-wrap{margin-top:8px;height:5px;border-radius:999px;background:#E5E5EA;overflow:hidden;display:none}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#97C459,#3B8800);border-radius:999px;transition:width .08s linear}
.progress-label{font-size:11px;color:#8E8E93;margin-top:5px;text-align:center;display:none;min-height:16px}

/* ---- INPUT ---- */
.input-card{background:#fff;border:1px solid #E5E5EA;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.input-card label{font-size:13px;color:#8E8E93;display:block;margin-bottom:8px}
.input-card textarea{width:100%;min-height:68px;resize:none;font-size:15px;padding:10px 12px;border-radius:10px;font-family:inherit;border:1px solid #E5E5EA;color:#1C1C1E;background:#F9F9F9;outline:none;line-height:1.5}
.input-card textarea:focus{border-color:#639922;background:#fff}
.plant-btn{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;background:#639922;color:#fff;border:none;border-radius:12px;cursor:pointer;transition:all .15s}
.plant-btn:hover{background:#4A7A18}
.plant-btn:active{transform:scale(0.98)}
.plant-btn:disabled{background:#C0DD97;color:#fff;cursor:default;transform:none}

/* ---- LOG ---- */
.section-title{font-size:13px;font-weight:600;color:#8E8E93;margin-bottom:10px}
.log-empty{font-size:14px;color:#C7C7CC;text-align:center;padding:24px 0}

/* pending logs */
.pending-section{margin-bottom:6px}
.log-item{background:#fff;border:1px solid #E5E5EA;border-radius:14px;margin-bottom:8px;overflow:hidden;animation:fi .3s ease}
.log-item.waiting{border:1.5px solid #F0A030;background:#FFFCF5}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.log-top{display:flex;align-items:flex-start;gap:10px;padding:12px 14px}
.log-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.log-icon.pending-icon{background:#FFF4DE}
.log-icon.done-icon{background:#EAF3DE}
.log-icon svg{width:17px;height:17px}
.log-body{flex:1;min-width:0}
.log-text{font-size:14px;color:#1C1C1E;line-height:1.55;word-break:break-all}
.log-meta{font-size:12px;color:#8E8E93;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status-pill{font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.sp-wait{background:#FFF4DE;color:#8A4F0C}
.sp-planted{background:#EAF3DE;color:#2A5A08}
.num-badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;flex-shrink:0;align-self:flex-start}
.num-badge.wait-num{color:#8A4F0C;background:#FFF4DE}
.num-badge.done-num{color:#2A5A08;background:#D4EFBC}

/* completed section collapsible */
.completed-section{}
.completed-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border:1px solid #E5E5EA;border-radius:14px;cursor:pointer;margin-bottom:0;transition:border-radius .2s}
.completed-header.open{border-radius:14px 14px 0 0;border-bottom:none}
.completed-header-left{display:flex;align-items:center;gap:8px}
.completed-header-left .ch-icon{font-size:18px}
.completed-header-left .ch-title{font-size:14px;font-weight:500;color:#2A5A08}
.completed-header-left .ch-count{font-size:12px;color:#639922;background:#EAF3DE;border-radius:999px;padding:2px 9px}
.ch-arrow{font-size:14px;color:#8E8E93;transition:transform .25s}
.ch-arrow.open{transform:rotate(180deg)}
.completed-body{background:#F4FAF0;border:1px solid #E5E5EA;border-top:none;border-radius:0 0 14px 14px;overflow:hidden;max-height:0;transition:max-height .35s ease}
.completed-body.open{max-height:2000px}
.completed-inner{padding:10px 12px}
.done-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:#fff;border:1px solid #D4EFBC;border-radius:10px;margin-bottom:7px;animation:fi .3s ease}
.done-item:last-child{margin-bottom:0}
.done-icon-wrap{width:30px;height:30px;border-radius:50%;background:#EAF3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.done-icon-wrap svg{width:16px;height:16px}
.done-body{flex:1;min-width:0}
.done-text{font-size:13px;color:#2A3A1A;line-height:1.5;word-break:break-all}
.done-meta{font-size:11px;color:#8E8E93;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.done-badge{font-size:11px;font-weight:600;color:#2A5A08;background:#D4EFBC;border-radius:999px;padding:2px 9px;flex-shrink:0;align-self:flex-start}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .22s;pointer-events:none;white-space:nowrap;z-index:999;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>心情树 · 追光绿洲</h1>
    <p>每克服一次困难，种下一棵心情树</p>
  </div>
  <div class="badges">
    <div class="badge pending">
      <span class="n" id="cnt-pending">0</span>
      <span class="l">待种植</span>
    </div>
    <div class="badge total">
      <span class="n" id="cnt-total">0</span>
      <span class="l">已扎根</span>
    </div>
  </div>
</div>

<!-- 沙漠 -->
<div id="desert-wrap">
  <svg id="dsvg" viewBox="0 0 480 210" preserveAspectRatio="xMidYMid meet">
    <rect width="480" height="210" fill="#F5EDD6"/>
    <ellipse cx="60" cy="204" rx="75" ry="11" fill="#E8D9A0" opacity="0.6"/>
    <ellipse cx="240" cy="207" rx="110" ry="10" fill="#E8D9A0" opacity="0.5"/>
    <ellipse cx="420" cy="205" rx="80" ry="9" fill="#E8D9A0" opacity="0.55"/>
    <path d="M0 165 Q80 150 160 160 Q240 170 320 155 Q400 142 480 158 L480 210 L0 210Z" fill="#D4C07A" opacity="0.45"/>
    <g id="trees-planted"></g>
    <g id="trees-waiting"></g>
    <text id="hint" x="240" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#C8A84B" opacity="0.9">还没有心情树，快去种第一棵吧！</text>
  </svg>
</div>

<!-- 队列区：凑满3棵发车 -->
<div class="queue-bar">
  <div class="queue-title">
    🚗 机器人出发队列（凑满3棵才能出发）
    <span id="queue-hint">还差 3 棵</span>
  </div>
  <div class="queue-slots" id="queue-slots">
    <div class="slot" id="slot-0"><div class="slot-icon">🌱</div><div class="slot-label">等待中...</div></div>
    <div class="slot" id="slot-1"><div class="slot-icon">🌱</div><div class="slot-label">等待中...</div></div>
    <div class="slot" id="slot-2"><div class="slot-icon">🌱</div><div class="slot-label">等待中...</div></div>
  </div>
  <div class="dispatch-bar">
    <button class="dispatch-btn locked" id="dispatch-btn" disabled>🔒 再种 3 棵才能出发</button>
    <div class="progress-wrap" id="prog-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="progress-label" id="prog-label"></div>
  </div>
</div>

<!-- 输入区 -->
<div class="input-card">
  <label for="ta">今天，你克服了什么困难？</label>
  <textarea id="ta" placeholder="比如：考试前很紧张，但还是认真复习了；练习很久终于学会了一个新技能……"></textarea>
  <button class="plant-btn" id="pbtn" disabled>🌱 种下一棵心情树</button>
</div>

<!-- 等待派遣记录 -->
<div id="pending-section">
  <div class="section-title" id="pending-title" style="display:none">🟡 等待派遣（<span id="pending-count">0</span> 棵）</div>
  <div id="pending-list"></div>
</div>

<!-- 已完成折叠区 -->
<div class="completed-section" id="completed-section" style="display:none">
  <div class="completed-header" id="completed-header" onclick="toggleCompleted()">
    <div class="completed-header-left">
      <span class="ch-icon">🌳</span>
      <span class="ch-title">已在沙漠扎根</span>
      <span class="ch-count" id="done-count">0 棵</span>
    </div>
    <span class="ch-arrow" id="ch-arrow">▼</span>
  </div>
  <div class="completed-body" id="completed-body">
    <div class="completed-inner" id="done-list"></div>
  </div>
</div>

<div class="log-empty" id="lempty">还没有记录，快写下第一条吧！</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';

  // 状态
  var allTrees=[]; // {text, time, state:'waiting'|'planted'}
  var queue=[];    // 最多3条waiting的idx
  var isDispatching=false;
  var completedOpen=false;

  // DOM
  var ta=document.getElementById('ta');
  var pbtn=document.getElementById('pbtn');
  var hint=document.getElementById('hint');
  var lempty=document.getElementById('lempty');
  var tgPlanted=document.getElementById('trees-planted');
  var tgWaiting=document.getElementById('trees-waiting');
  var pendingList=document.getElementById('pending-list');
  var doneList=document.getElementById('done-list');
  var dispBtn=document.getElementById('dispatch-btn');
  var progWrap=document.getElementById('prog-wrap');
  var progBar=document.getElementById('prog-bar');
  var progLabel=document.getElementById('prog-label');
  var queueHint=document.getElementById('queue-hint');
  var cntPending=document.getElementById('cnt-pending');
  var cntTotal=document.getElementById('cnt-total');
  var pendingTitle=document.getElementById('pending-title');
  var pendingCount=document.getElementById('pending-count');
  var completedSection=document.getElementById('completed-section');
  var doneCount=document.getElementById('done-count');
  var toastEl=document.getElementById('toast');
  var toastTimer=null;

  ta.addEventListener('input',function(){ pbtn.disabled=ta.value.trim().length<2; });

  pbtn.addEventListener('click',function(){
    var t=ta.value.trim();
    if(!t) return;
    addTree(t);
    ta.value='';
    pbtn.disabled=true;
  });

  function addTree(text){
    var idx=allTrees.length;
    allTrees.push({text:text, time:new Date(), state:'waiting'});
    queue.push(idx);
    hint.style.display='none';
    lempty.style.display='none';

    drawWaitingTree(idx);
    addPendingLog(text, idx);
    updateQueueSlots();
    updateCounters();
    showToast('第'+(idx+1)+'棵心情树种下了！等待凑满3棵出发 🌱');
  }

  // ---- 沙漠树绘制 ----
  function treeX(idx){
    var col=idx%10;
    var row=Math.floor(idx/10);
    return 26+col*45+(row%2)*12;
  }
  function treeY(idx){
    var row=Math.floor(idx/10);
    var y=148-row*32;
    return y<22?22:y;
  }

  // 等待种植：橙黄色虚线风格
  function drawWaitingTree(idx){
    var x=treeX(idx), y=treeY(idx);
    var g=document.createElementNS(NS,'g');
    g.setAttribute('id','wt-'+idx);
    g.style.opacity='0';
    g.style.transition='opacity 0.4s';

    var trunk=document.createElementNS(NS,'rect');
    trunk.setAttribute('x',String(x-2));
    trunk.setAttribute('y',String(y+10));
    trunk.setAttribute('width','4');
    trunk.setAttribute('height','10');
    trunk.setAttribute('rx','1');
    trunk.setAttribute('fill','#B89040');
    g.appendChild(trunk);

    // 叶子：橙黄色、半透明，轮廓感
    var leaves=[[0,3,9,7],[-6,7,7,5],[6,7,7,5]];
    for(var i=0;i<leaves.length;i++){
      var d=leaves[i];
      var e=document.createElementNS(NS,'ellipse');
      e.setAttribute('cx',String(x+d[0]));
      e.setAttribute('cy',String(y+d[1]));
      e.setAttribute('rx',String(d[2]));
      e.setAttribute('ry',String(d[3]));
      e.setAttribute('fill','#F0C040');
      e.setAttribute('opacity','0.55');
      e.setAttribute('stroke','#D4A020');
      e.setAttribute('stroke-width','1');
      g.appendChild(e);
    }
    tgWaiting.appendChild(g);
    requestAnimationFrame(function(){ g.style.opacity='1'; });
  }

  // 已种植：深绿色饱满
  function drawPlantedTree(idx){
    var x=treeX(idx), y=treeY(idx);
    var g=document.createElementNS(NS,'g');
    g.setAttribute('id','pt-'+idx);
    g.style.opacity='0';
    g.style.transition='opacity 0.5s';

    var trunk=document.createElementNS(NS,'rect');
    trunk.setAttribute('x',String(x-2.5));
    trunk.setAttribute('y',String(y+9));
    trunk.setAttribute('width','5');
    trunk.setAttribute('height','12');
    trunk.setAttribute('rx','1.5');
    trunk.setAttribute('fill','#5A3C08');
    g.appendChild(trunk);

    var leaves=[[0,2,10,8],[-7,7,8,6],[7,7,8,6]];
    var cols=['#4DAF18','#3B9610','#58C224'];
    for(var i=0;i<leaves.length;i++){
      var d=leaves[i];
      var e=document.createElementNS(NS,'ellipse');
      e.setAttribute('cx',String(x+d[0]));
      e.setAttribute('cy',String(y+d[1]));
      e.setAttribute('rx',String(d[2]));
      e.setAttribute('ry',String(d[3]));
      e.setAttribute('fill',cols[i]);
      e.setAttribute('opacity','0.95');
      g.appendChild(e);
    }
    tgPlanted.appendChild(g);
    requestAnimationFrame(function(){ g.style.opacity='1'; });
  }

  function removeWaitingTree(idx){
    var g=document.getElementById('wt-'+idx);
    if(g) g.parentNode.removeChild(g);
  }

  // ---- 队列槽 ----
  function updateQueueSlots(){
    var slots=['slot-0','slot-1','slot-2'];
    for(var i=0;i<3;i++){
      var slot=document.getElementById(slots[i]);
      if(i<queue.length){
        var t=allTrees[queue[i]];
        var short=t.text.length>10?t.text.substring(0,10)+'…':t.text;
        slot.className='slot filled';
        slot.innerHTML='<div class="slot-icon">🌱</div><div class="slot-label">'+esc(short)+'</div>';
      } else {
        slot.className='slot';
        slot.innerHTML='<div class="slot-icon">🌱</div><div class="slot-label">等待中...</div>';
      }
    }
    var need=3-queue.length;
    if(queue.length>=3 && !isDispatching){
      queueHint.textContent='可以出发了！';
      dispBtn.className='dispatch-btn ready';
      dispBtn.textContent='🚗 派遣机器人出发（3棵）';
      dispBtn.disabled=false;
      dispBtn.onclick=startDispatch;
    } else if(isDispatching){
      queueHint.textContent='机器人种植中...';
    } else {
      queueHint.textContent='还差 '+need+' 棵';
      dispBtn.className='dispatch-btn locked';
      dispBtn.textContent='🔒 再种 '+need+' 棵才能出发';
      dispBtn.disabled=true;
      dispBtn.onclick=null;
    }
  }

  function updateCounters(){
    var waiting=allTrees.filter(function(t){return t.state==='waiting';}).length;
    var planted=allTrees.filter(function(t){return t.state==='planted';}).length;
    cntPending.textContent=waiting;
    cntTotal.textContent=planted;
    if(waiting>0){
      pendingTitle.style.display='block';
      pendingCount.textContent=waiting;
    } else {
      pendingTitle.style.display='none';
    }
    if(planted>0){
      completedSection.style.display='block';
      doneCount.textContent=planted+'棵';
    }
  }

  // ---- 待派遣日记 ----
  function addPendingLog(text, idx){
    var item=document.createElement('div');
    item.className='log-item waiting';
    item.id='pending-item-'+idx;
    var t=allTrees[idx];
    item.innerHTML=
      '<div class="log-top">'+
        '<div class="log-icon pending-icon">'+waitSvg()+'</div>'+
        '<div class="log-body">'+
          '<div class="log-text">'+esc(text)+'</div>'+
          '<div class="log-meta">'+
            '<span>'+fmt(t.time)+'</span>'+
            '<span class="status-pill sp-wait">等待派遣</span>'+
          '</div>'+
        '</div>'+
        '<div class="num-badge wait-num">第'+(idx+1)+'棵</div>'+
      '</div>';
    pendingList.appendChild(item);
  }

  function removePendingLog(idx){
    var el=document.getElementById('pending-item-'+idx);
    if(el) el.parentNode.removeChild(el);
  }

  // ---- 已完成日记 ----
  function addDoneLog(text, idx){
    var t=allTrees[idx];
    var item=document.createElement('div');
    item.className='done-item';
    item.innerHTML=
      '<div class="done-icon-wrap">'+plantedSvg()+'</div>'+
      '<div class="done-body">'+
        '<div class="done-text">'+esc(text)+'</div>'+
        '<div class="done-meta">'+
          '<span>'+fmt(t.time)+'</span>'+
          '<span class="status-pill sp-planted">已扎根</span>'+
        '</div>'+
      '</div>'+
      '<div class="done-badge">第'+(idx+1)+'棵</div>';
    doneList.insertBefore(item, doneList.firstChild);
  }

  // ---- 派遣出发 ----
  function startDispatch(){
    if(queue.length<3||isDispatching) return;
    isDispatching=true;
    var batch=queue.splice(0,3);

    dispBtn.className='dispatch-btn going';
    dispBtn.innerHTML='<span class="dot-anim"></span> 机器人出发中，正在前往沙漠...';
    dispBtn.disabled=true;
    dispBtn.onclick=null;
    progWrap.style.display='block';
    progLabel.style.display='block';
    queueHint.textContent='机器人种植中...';

    showToast('机器人收到指令，携带3棵心情树出发！🚗');

    var stages=[
      {pct:15, dur:900,  msg:'启动追光供能系统...'},
      {pct:40, dur:1200, msg:'机器人行进中...'},
      {pct:62, dur:1000, msg:'已到达种植区域！'},
      {pct:80, dur:900,  msg:'第1棵种植完成！'},
      {pct:92, dur:800,  msg:'第2棵种植完成！'},
      {pct:100,dur:700,  msg:'第3棵种植完成！'}
    ];
    var si=0, cur=0;

    function runStage(){
      if(si>=stages.length){
        finishDispatch(batch);
        return;
      }
      var s=stages[si];
      progLabel.textContent=s.msg;
      if(si>=2) showToast(s.msg);
      var start=cur, end=s.pct, elapsed=0, iv=40;
      var timer=setInterval(function(){
        elapsed+=iv;
        var r=Math.min(elapsed/s.dur,1);
        cur=start+(end-start)*(1-(1-r)*(1-r));
        progBar.style.width=cur.toFixed(1)+'%';
        if(r>=1){ clearInterval(timer); si++; setTimeout(runStage,250); }
      },iv);
    }
    runStage();
  }

  function finishDispatch(batch){
    // 更新状态
    for(var i=0;i<batch.length;i++){
      var idx=batch[i];
      allTrees[idx].state='planted';
      removeWaitingTree(idx);
      removePendingLog(idx);
      drawPlantedTree(idx);
      addDoneLog(allTrees[idx].text, idx);
    }

    // 重置进度条
    setTimeout(function(){
      progBar.style.width='0%';
      progWrap.style.display='none';
      progLabel.style.display='none';
      progLabel.textContent='';
      isDispatching=false;

      dispBtn.className='dispatch-btn done-btn';
      dispBtn.innerHTML='✅ 3棵种植完成！机器人返回待命';
      dispBtn.disabled=true;

      updateCounters();
      updateQueueSlots();

      // 如果队列里还有>=3棵，短暂延迟后恢复可出发
      setTimeout(function(){
        if(queue.length>=3){
          dispBtn.className='dispatch-btn ready';
          dispBtn.textContent='🚗 派遣机器人出发（3棵）';
          dispBtn.disabled=false;
          dispBtn.onclick=startDispatch;
          queueHint.textContent='可以出发了！';
        } else if(queue.length>0){
          var need=3-queue.length;
          dispBtn.className='dispatch-btn locked';
          dispBtn.textContent='🔒 再种 '+need+' 棵才能出发';
          dispBtn.disabled=true;
          dispBtn.onclick=null;
          queueHint.textContent='还差 '+need+' 棵';
        } else {
          dispBtn.className='dispatch-btn locked';
          dispBtn.textContent='🔒 再种 3 棵才能出发';
          dispBtn.disabled=true;
          dispBtn.onclick=null;
          queueHint.textContent='还差 3 棵';
        }
      },1800);

      // 自动展开已完成区
      if(!completedOpen) toggleCompleted();
      showToast('种植成功！3棵心情树已在沙漠扎根！🌳');
    },400);
  }

  // ---- 折叠/展开 ----
  window.toggleCompleted=function(){
    completedOpen=!completedOpen;
    var body=document.getElementById('completed-body');
    var header=document.getElementById('completed-header');
    var arrow=document.getElementById('ch-arrow');
    if(completedOpen){
      body.className='completed-body open';
      header.className='completed-header open';
      arrow.className='ch-arrow open';
    } else {
      body.className='completed-body';
      header.className='completed-header';
      arrow.className='ch-arrow';
    }
  };

  // ---- 工具 ----
  function fmt(d){
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+
      String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function waitSvg(){
    return '<svg viewBox="0 0 18 18" fill="none" width="17" height="17">'+
      '<rect x="8" y="11" width="2.5" height="5" rx="1" fill="#B89040"/>'+
      '<ellipse cx="9" cy="6" rx="5.5" ry="4.5" fill="#F0C040" opacity="0.8" stroke="#D4A020" stroke-width="0.8"/>'+
      '<ellipse cx="5.5" cy="8.5" rx="4" ry="3.2" fill="#F0C040" opacity="0.7" stroke="#D4A020" stroke-width="0.8"/>'+
      '<ellipse cx="12.5" cy="8.5" rx="4" ry="3.2" fill="#F0C040" opacity="0.7" stroke="#D4A020" stroke-width="0.8"/>'+
    '</svg>';
  }
  function plantedSvg(){
    return '<svg viewBox="0 0 18 18" fill="none" width="16" height="16">'+
      '<rect x="8" y="11" width="2.5" height="5" rx="1" fill="#5A3C08"/>'+
      '<ellipse cx="9" cy="6" rx="5.5" ry="4.5" fill="#4DAF18" opacity="0.95"/>'+
      '<ellipse cx="5.5" cy="8.5" rx="4" ry="3.2" fill="#3B9610" opacity="0.9"/>'+
      '<ellipse cx="12.5" cy="8.5" rx="4" ry="3.2" fill="#58C224" opacity="0.9"/>'+
    '</svg>';
  }

  function showToast(msg){
    if(toastTimer) clearTimeout(toastTimer);
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },2600);
  }
})();
</script>
</body>
</html>
